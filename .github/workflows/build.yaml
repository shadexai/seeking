name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '22'           # Use Node 22 to avoid deprecation warning
          cache: 'npm'

      - name: Install dependencies (generates package-lock.json)
        run: npm install               # Creates lock file automatically

      - name: Install Capacitor CLI globally
        run: npm install -g @capacitor/cli

      - name: Add Android platform
        run: npx cap add android

      - name: Inject custom plugin source
        run: |
          mkdir -p android/app/src/main/java/com/shade/seeking/plugin
          cp plugin-src/HttpServerPlugin.java android/app/src/main/java/com/shade/seeking/plugin/

          # Create MainActivity that registers the plugin
          cat > android/app/src/main/java/com/shade/seeking/MainActivity.java << 'EOF'
          package com.shade.seeking;
          import com.getcapacitor.BridgeActivity;
          import com.shade.seeking.plugin.HttpServerPlugin;
          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(android.os.Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  registerPlugin(HttpServerPlugin.class);
              }
          }
          EOF

      - name: Add NanoHTTPD dependency to build.gradle
        run: |
          sed -i '/dependencies {/a \    implementation '\''org.nanohttpd:nanohttpd:2.3.1'\''' android/app/build.gradle

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: seeking-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
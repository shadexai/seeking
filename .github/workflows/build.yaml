name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate package-lock.json
        run: npm install --package-lock-only

      - name: Install dependencies
        run: npm ci

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Add Android platform
        run: npx cap add android

      # ---- Inject plugin ----
      - name: Create plugin package dir
        run: mkdir -p android/app/src/main/java/com/shade/seeking/plugin

      - name: Copy HttpServerPlugin.java
        run: cp plugin-src/HttpServerPlugin.java android/app/src/main/java/com/shade/seeking/plugin/

      - name: Create MainActivity.java
        run: |
          cat > android/app/src/main/java/com/shade/seeking/MainActivity.java << 'JAVAEOF'
          package com.shade.seeking;
          import com.getcapacitor.BridgeActivity;
          import com.shade.seeking.plugin.HttpServerPlugin;
          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(android.os.Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  registerPlugin(HttpServerPlugin.class);
              }
          }
          JAVAEOF

      # ---- Sync FIRST so it doesn't overwrite our changes ----
      - name: Sync Capacitor
        run: npx cap sync android

      # ---- The Capacitor template already has mavenCentral() in allprojects
      #      and fileTree(libs) in dependencies. We just need to add nanohttpd
      #      to the existing dependencies block using a precise sed target ----
      - name: Add NanoHTTPD to existing dependencies block
        run: |
          # Target the specific line that already exists in the template
          sed -i "s|implementation fileTree(include: \['\*.jar'\], dir: 'libs')|implementation fileTree(include: ['*.jar'], dir: 'libs')\n    implementation 'org.nanohttpd:nanohttpd:2.3.1'|" android/app/build.gradle

      - name: Confirm injection
        run: grep -A 3 "fileTree" android/app/build.gradle

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: seeking-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

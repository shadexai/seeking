name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Create lock file, then install
      - name: Generate package-lock.json
        run: npm install --package-lock-only

      - name: Install dependencies
        run: npm ci

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Add Android platform
        run: npx cap add android

      # ---- Inject plugin ----
      - name: Create plugin package dir
        run: mkdir -p android/app/src/main/java/com/shade/seeking/plugin

      - name: Copy HttpServerPlugin.java
        run: cp plugin-src/HttpServerPlugin.java android/app/src/main/java/com/shade/seeking/plugin/

      - name: Create MainActivity.java
        run: |
          cat > android/app/src/main/java/com/shade/seeking/MainActivity.java << 'EOF'
          package com.shade.seeking;
          import com.getcapacitor.BridgeActivity;
          import com.shade.seeking.plugin.HttpServerPlugin;
          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(android.os.Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  registerPlugin(HttpServerPlugin.class);
              }
          }
          EOF

      # ---- Add NanoHTTPD dependency ----
      - name: Add NanoHTTPD to build.gradle
        run: |
          sed -i '/dependencies {/a \    implementation '\''org.nanohttpd:nanohttpd:2.3.1'\''' android/app/build.gradle

      # ---- Verify modification ----
      - name: Show dependencies section
        run: cat android/app/build.gradle | grep -A 5 dependencies

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: seeking-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate package-lock.json
        run: npm install --package-lock-only

      - name: Install dependencies
        run: npm ci

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Add Android platform
        run: npx cap add android

      # ---- Inject plugin ----
      - name: Create plugin package dir
        run: mkdir -p android/app/src/main/java/com/shade/seeking/plugin

      - name: Copy HttpServerPlugin.java
        run: cp plugin-src/HttpServerPlugin.java android/app/src/main/java/com/shade/seeking/plugin/

      - name: Create MainActivity.java
        run: |
          cat > android/app/src/main/java/com/shade/seeking/MainActivity.java << 'JAVAEOF'
          package com.shade.seeking;
          import com.getcapacitor.BridgeActivity;
          import com.shade.seeking.plugin.HttpServerPlugin;
          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(android.os.Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  registerPlugin(HttpServerPlugin.class);
              }
          }
          JAVAEOF

      - name: Sync Capacitor
        run: npx cap sync android

      # ---- Inject NanoHTTPD dependency + mavenCentral into app repositories ----
      - name: Patch build.gradle
        run: |
          python3 - << 'PYEOF'
          path = 'android/app/build.gradle'
          with open(path, 'r') as f:
              content = f.read()

          # 1. Add nanohttpd to dependencies
          dep_old = "implementation fileTree(include: ['*.jar'], dir: 'libs')"
          dep_new = dep_old + "\n    implementation 'org.nanohttpd:nanohttpd:2.3.1'"
          if dep_old not in content:
              raise Exception("dependencies line not found:\n" + content)
          content = content.replace(dep_old, dep_new, 1)

          # 2. Add mavenCentral() to the app-level repositories block
          repo_old = "repositories {\n    flatDir{"
          repo_new = "repositories {\n    mavenCentral()\n    flatDir{"
          if repo_old not in content:
              raise Exception("repositories block not found:\n" + content)
          content = content.replace(repo_old, repo_new, 1)

          with open(path, 'w') as f:
              f.write(content)
          print("SUCCESS: patched build.gradle")
          PYEOF

      - name: Confirm patch
        run: |
          echo "=== repositories ==="
          grep -A 4 "^repositories" android/app/build.gradle
          echo "=== dependencies ==="
          grep -A 3 "fileTree" android/app/build.gradle

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: seeking-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

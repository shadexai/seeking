name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Add Android platform
        run: npx cap add android

      # ---- Inject plugin ----
      - name: Create plugin package dir
        run: mkdir -p android/app/src/main/java/com/shade/seeking/plugin

      - name: Copy HttpServerPlugin.java
        run: cp plugin-src/HttpServerPlugin.java android/app/src/main/java/com/shade/seeking/plugin/

      - name: Create MainActivity.java
        run: |
          cat > android/app/src/main/java/com/shade/seeking/MainActivity.java << 'EOF'
          package com.shade.seeking;
          import com.getcapacitor.BridgeActivity;
          import com.shade.seeking.plugin.HttpServerPlugin;
          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(android.os.Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  registerPlugin(HttpServerPlugin.class);
              }
          }
          EOF

      # ---- Add NanoHTTPD dependency ----
      - name: Add NanoHTTPD to build.gradle (reliable)
        run: |
          # Use awk to insert after the 'dependencies {' line
          awk '/dependencies {/ { print; print "    implementation '\''org.nanohttpd:nanohttpd:2.3.1'\''"; next }1' android/app/build.gradle > tmp && mv tmp android/app/build.gradle

      - name: Verify build.gradle (debug)
        run: cat android/app/build.gradle | grep -A 5 dependencies

      # ---- Ensure Internet permission ----
      - name: Ensure INTERNET permission
        run: |
          if ! grep -q "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml; then
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace   # show full error

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: seeking-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
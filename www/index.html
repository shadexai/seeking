<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Lara</title>
<link rel="manifest" href="manifest.json" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@1,72,500;1,72,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    background: #12151B;
    overscroll-behavior: none;
  }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: #ECEDEF;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
  }

  :root {
    --bg: #12151B;
    --surface: #1B1F27;
    --surface-2: #232833;
    --line: #2A2F3B;
    --ink: #ECEDEF;
    --ink-dim: #8A90A0;
    --amber: #D9A54A;
    --amber-dim: #6B5530;
    --teal: #5FB8A8;
    --danger: #E0684F;
  }

  /* ---------- Header ---------- */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 18px;
    padding-top: max(16px, env(safe-area-inset-top));
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    z-index: 20;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .mark {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #E8BC6E, #B9812C);
    position: relative;
    flex-shrink: 0;
  }
  .mark::after {
    content: '';
    position: absolute;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #12151B;
    top: 8px; left: 11px;
  }
  .mark.thinking { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(217,165,74,0.45); }
    50% { box-shadow: 0 0 0 7px rgba(217,165,74,0); }
  }
  .brand-text h1 {
    font-family: 'Newsreader', serif;
    font-style: italic;
    font-weight: 600;
    font-size: 21px;
    color: var(--ink);
    line-height: 1;
  }
  .brand-text p {
    font-size: 11px;
    color: var(--ink-dim);
    margin-top: 2px;
    letter-spacing: 0.02em;
  }
  .icon-btn {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: var(--surface);
    border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-dim);
    cursor: pointer;
  }
  .icon-btn:active { background: var(--surface-2); }

  /* ---------- Chat area ---------- */
  main {
    flex: 1;
    overflow-y: auto;
    padding: 18px 16px 8px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .empty {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--ink-dim);
    gap: 8px;
    padding: 0 30px;
  }
  .empty .mark { width: 52px; height: 52px; margin-bottom: 10px; }
  .empty .mark::after { width: 9px; height: 9px; top: 13px; left: 17px; }
  .empty h2 { font-family: 'Newsreader', serif; font-style: italic; color: var(--ink); font-size: 20px; font-weight: 500; }
  .empty p { font-size: 13px; line-height: 1.5; max-width: 260px; }

  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .row.assistant { justify-content: flex-start; }

  .bubble {
    max-width: 82%;
    padding: 11px 15px;
    border-radius: 18px;
    font-size: 15px;
    line-height: 1.45;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .row.user .bubble {
    background: var(--teal);
    color: #0E1613;
    border-bottom-right-radius: 5px;
  }
  .row.assistant .bubble {
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--ink);
    border-bottom-left-radius: 5px;
  }
  .row.error .bubble {
    background: rgba(224,104,79,0.12);
    border: 1px solid rgba(224,104,79,0.35);
    color: #F0AEA0;
    font-size: 13px;
  }

  .typing { display: flex; gap: 4px; padding: 6px 4px; }
  .typing span {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--amber);
    opacity: 0.5;
    animation: bounce 1.1s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  /* ---------- Input bar ---------- */
  .input-bar {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    padding: 10px 12px;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
    background: var(--bg);
    border-top: 1px solid var(--line);
  }
  #composer {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 11px 16px;
    color: var(--ink);
    font-size: 15px;
    font-family: inherit;
    resize: none;
    max-height: 120px;
    line-height: 1.4;
  }
  #composer:focus { outline: none; border-color: var(--amber-dim); }
  #composer::placeholder { color: var(--ink-dim); }
  #sendBtn {
    width: 42px; height: 42px;
    border-radius: 50%;
    background: var(--amber);
    border: none;
    color: #1A1305;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    cursor: pointer;
  }
  #sendBtn:disabled { opacity: 0.4; }
  #sendBtn:active:not(:disabled) { transform: scale(0.94); }

  /* ---------- Modal (settings / setup) ---------- */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(10,12,16,0.72);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 50;
  }
  .overlay.show { display: flex; }
  .sheet {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 20px 20px 0 0;
    width: 100%;
    max-width: 480px;
    padding: 22px 20px;
    padding-bottom: max(22px, env(safe-area-inset-bottom));
  }
  .sheet h3 {
    font-family: 'Newsreader', serif;
    font-style: italic;
    font-size: 19px;
    margin-bottom: 4px;
  }
  .sheet .sub { font-size: 12.5px; color: var(--ink-dim); margin-bottom: 18px; line-height: 1.5; }
  label { font-size: 12px; color: var(--ink-dim); display: block; margin-bottom: 6px; margin-top: 14px; text-transform: uppercase; letter-spacing: 0.05em; }
  input[type="password"], select {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--ink);
    font-size: 14px;
    font-family: inherit;
  }
  select { appearance: none; }
  .sheet-actions { display: flex; gap: 10px; margin-top: 20px; }
  .btn {
    flex: 1;
    padding: 13px;
    border-radius: 12px;
    border: none;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-primary { background: var(--amber); color: #1A1305; }
  .btn-ghost { background: transparent; border: 1px solid var(--line); color: var(--ink-dim); }
  .btn-danger { background: transparent; border: 1px solid rgba(224,104,79,0.4); color: var(--danger); }
  .hint { font-size: 11.5px; color: var(--ink-dim); margin-top: 8px; line-height: 1.5; }
  .hint a { color: var(--teal); text-decoration: none; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="mark" id="brandMark"></div>
    <div class="brand-text">
      <h1>Lara</h1>
      <p id="statusText">ready</p>
    </div>
  </div>
  <div class="icon-btn" id="settingsBtn" aria-label="Settings">⚙</div>
</header>

<main id="chat">
  <div class="empty" id="emptyState">
    <div class="mark"></div>
    <h2>Hey, I'm Lara.</h2>
    <p>Ask me anything — I keep it sharp and to the point. Your chat stays on this device.</p>
  </div>
</main>

<div class="input-bar">
  <textarea id="composer" placeholder="Message Lara…" rows="1"></textarea>
  <button id="sendBtn" aria-label="Send">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 12L20 4L13 20L11 13L4 12Z" fill="currentColor"/></svg>
  </button>
</div>

<!-- Settings / setup sheet -->
<div class="overlay" id="overlay">
  <div class="sheet">
    <h3>Setup</h3>
    <div class="sub">Your Groq API key lives only on this device (local storage) — it's never bundled into the app itself.</div>

    <label for="apiKeyInput">Groq API key</label>
    <input type="password" id="apiKeyInput" placeholder="gsk_..." autocomplete="off" />

    <label for="modelSelect">Model</label>
    <select id="modelSelect">
      <option value="moonshotai/kimi-k2-instruct-0905">Kimi K2 — highest quality</option>
      <option value="openai/gpt-oss-120b">GPT-OSS 120B — fast &amp; strong</option>
      <option value="openai/gpt-oss-20b">GPT-OSS 20B — fastest</option>
    </select>
    <div class="hint">Get a free key at <a href="https://console.groq.com/keys" id="consoleLink">console.groq.com/keys</a>.</div>

    <div class="sheet-actions">
      <button class="btn btn-ghost" id="clearHistoryBtn">Clear chat</button>
      <button class="btn btn-primary" id="saveSettingsBtn">Save</button>
    </div>
  </div>
</div>

<script>
(function () {
  const chatEl = document.getElementById('chat');
  const emptyState = document.getElementById('emptyState');
  const composer = document.getElementById('composer');
  const sendBtn = document.getElementById('sendBtn');
  const brandMark = document.getElementById('brandMark');
  const statusText = document.getElementById('statusText');

  const overlay = document.getElementById('overlay');
  const settingsBtn = document.getElementById('settingsBtn');
  const apiKeyInput = document.getElementById('apiKeyInput');
  const modelSelect = document.getElementById('modelSelect');
  const saveSettingsBtn = document.getElementById('saveSettingsBtn');
  const clearHistoryBtn = document.getElementById('clearHistoryBtn');

  const STORAGE_KEY = 'lara_api_key';
  const STORAGE_MODEL = 'lara_model';
  const STORAGE_HISTORY = 'lara_history';

  const SYSTEM_PROMPT = `You are Lara, a smart, efficient personal assistant living in the user's own app on their phone.
Be genuinely useful: answer directly, skip filler and preamble, and match your length to the question — short answers for simple things, more detail only when it's actually needed.
Have a warm, direct, slightly witty personality, but never at the expense of clarity. Ask a clarifying question only when you truly can't proceed without one.`;

  let history = JSON.parse(localStorage.getItem(STORAGE_HISTORY) || '[]');
  let sending = false;

  function getKey() { return localStorage.getItem(STORAGE_KEY) || ''; }
  function getModel() { return localStorage.getItem(STORAGE_MODEL) || 'moonshotai/kimi-k2-instruct-0905'; }

  function renderHistory() {
    chatEl.innerHTML = '';
    if (history.length === 0) {
      chatEl.appendChild(emptyState);
      return;
    }
    history.forEach(m => addBubble(m.role, m.content, false));
    scrollToBottom();
  }

  function addBubble(role, text, animate) {
    if (emptyState.parentNode) emptyState.remove();
    const row = document.createElement('div');
    row.className = 'row ' + role;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    row.appendChild(bubble);
    chatEl.appendChild(row);
    if (animate) scrollToBottom();
    return bubble;
  }

  function addTypingIndicator() {
    const row = document.createElement('div');
    row.className = 'row assistant';
    row.id = 'typingRow';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
    row.appendChild(bubble);
    chatEl.appendChild(row);
    scrollToBottom();
  }

  function removeTypingIndicator() {
    const row = document.getElementById('typingRow');
    if (row) row.remove();
  }

  function scrollToBottom() {
    requestAnimationFrame(() => { chatEl.scrollTop = chatEl.scrollHeight; });
  }

  function setThinking(on) {
    brandMark.classList.toggle('thinking', on);
    statusText.textContent = on ? 'thinking…' : 'ready';
    sendBtn.disabled = on;
  }

  function autoGrow() {
    composer.style.height = 'auto';
    composer.style.height = Math.min(composer.scrollHeight, 120) + 'px';
  }
  composer.addEventListener('input', autoGrow);

  composer.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      handleSend();
    }
  });
  sendBtn.addEventListener('click', handleSend);

  async function handleSend() {
    const text = composer.value.trim();
    if (!text || sending) return;

    if (!getKey()) {
      openSettings();
      return;
    }

    composer.value = '';
    autoGrow();
    addBubble('user', text, true);
    history.push({ role: 'user', content: text });
    persistHistory();

    sending = true;
    setThinking(true);
    addTypingIndicator();

    try {
      const reply = await callGroq(history);
      removeTypingIndicator();
      addBubble('assistant', reply, true);
      history.push({ role: 'assistant', content: reply });
      persistHistory();
    } catch (err) {
      removeTypingIndicator();
      const row = document.createElement('div');
      row.className = 'row error';
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = 'Something went wrong: ' + err.message;
      row.appendChild(bubble);
      chatEl.appendChild(row);
      scrollToBottom();
    } finally {
      sending = false;
      setThinking(false);
    }
  }

  async function callGroq(msgs) {
    const apiKey = getKey();
    const model = getModel();
    const trimmed = msgs.slice(-20); // keep recent context lean

    const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + apiKey
      },
      body: JSON.stringify({
        model: model,
        messages: [{ role: 'system', content: SYSTEM_PROMPT }, ...trimmed],
        temperature: 0.6,
        max_tokens: 1024
      })
    });

    if (!res.ok) {
      const errBody = await res.text().catch(() => '');
      if (res.status === 401) throw new Error('Invalid API key — check it in Settings.');
      throw new Error('Groq API error (' + res.status + ')');
    }
    const data = await res.json();
    return data.choices?.[0]?.message?.content?.trim() || '(empty response)';
  }

  function persistHistory() {
    localStorage.setItem(STORAGE_HISTORY, JSON.stringify(history.slice(-100)));
  }

  // ---------- Settings sheet ----------
  function openSettings() {
    apiKeyInput.value = getKey();
    modelSelect.value = getModel();
    overlay.classList.add('show');
  }
  function closeSettings() { overlay.classList.remove('show'); }

  settingsBtn.addEventListener('click', openSettings);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeSettings(); });

  saveSettingsBtn.addEventListener('click', () => {
    const key = apiKeyInput.value.trim();
    if (key) localStorage.setItem(STORAGE_KEY, key);
    localStorage.setItem(STORAGE_MODEL, modelSelect.value);
    closeSettings();
  });

  clearHistoryBtn.addEventListener('click', () => {
    history = [];
    localStorage.removeItem(STORAGE_HISTORY);
    renderHistory();
    closeSettings();
  });

  // ---------- Boot ----------
  renderHistory();
  if (!getKey()) {
    setTimeout(openSettings, 300);
  }

  if (window.Capacitor) {
    console.log('Lara running natively on Android');
  }
})();
</script>

</body>
</html>

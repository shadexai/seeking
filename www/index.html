<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Seeking</title>
<link rel="manifest" href="manifest.json" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #12151B; overscroll-behavior: none; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: #ECEDEF;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
    animation: appIn 0.4s ease;
    position: relative;
    overflow: hidden;
  }
  @keyframes appIn { from { opacity: 0; } to { opacity: 1; } }

  :root {
    --bg: #12151B;
    --surface: #1B1F27;
    --surface-2: #232833;
    --line: #2A2F3B;
    --ink: #ECEDEF;
    --ink-dim: #8A90A0;
    --green: #3ECF8E;
    --green-dim: #1C4A38;
    --amber: #E8A33D;
    --amber-dim: #5C3F1B;
    --danger: #E0684F;
  }
  .num { font-variant-numeric: tabular-nums; }

  /* ---------- Header ---------- */
  header {
    padding: 18px 20px 14px;
    padding-top: max(18px, env(safe-area-inset-top));
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 {
    font-size: 23px;
    font-weight: 800;
    letter-spacing: -0.01em;
  }
  header .stats {
    font-size: 12.5px;
    color: var(--ink-dim);
    margin-top: 4px;
  }

  /* ---------- Home / goal list ---------- */
  #home { flex: 1; overflow-y: auto; padding: 16px 16px 100px; }

  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--ink-dim);
    padding: 60px 30px;
    gap: 8px;
  }
  .empty-state .glyph { font-size: 34px; margin-bottom: 6px; }
  .empty-state h2 { color: var(--ink); font-size: 18px; font-weight: 700; }
  .empty-state p { font-size: 13.5px; line-height: 1.5; max-width: 240px; }

  .goal-card {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 14px 16px;
    margin-bottom: 12px;
    cursor: pointer;
    animation: cardIn 0.3s cubic-bezier(.22,1,.36,1) both;
  }
  .goal-card:active { background: var(--surface-2); }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .ring-wrap { position: relative; width: 54px; height: 54px; flex-shrink: 0; }
  .ring-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: var(--surface-2); }
  .ring-fill { fill: none; stroke-linecap: round; transition: stroke-dashoffset 0.6s cubic-bezier(.22,1,.36,1); }
  .ring-emoji { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 18px; }

  .streak-badge {
    width: 54px; height: 54px;
    border-radius: 50%;
    background: var(--amber-dim);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .streak-badge .n { font-size: 17px; font-weight: 800; color: var(--amber); line-height: 1; }
  .streak-badge .u { font-size: 8px; color: var(--amber); opacity: 0.8; letter-spacing: 0.04em; text-transform: uppercase; margin-top: 1px; }

  .goal-info { flex: 1; min-width: 0; }
  .goal-info .name { font-size: 15.5px; font-weight: 600; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .goal-info .sub { font-size: 12.5px; color: var(--ink-dim); }
  .goal-info .sub .accent-green { color: var(--green); font-weight: 600; }
  .goal-info .sub .accent-amber { color: var(--amber); font-weight: 600; }

  .dot-row { display: flex; gap: 3px; margin-top: 6px; }
  .dot-row .d { width: 6px; height: 6px; border-radius: 50%; background: var(--surface-2); }
  .dot-row .d.on { background: var(--amber); }

  /* ---------- FAB ---------- */
  .fab {
    position: fixed;
    right: 20px;
    bottom: max(24px, env(safe-area-inset-bottom));
    width: 58px; height: 58px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--green), var(--amber));
    border: none;
    color: #10130F;
    font-size: 26px;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    cursor: pointer;
    z-index: 15;
  }
  .fab:active { transform: scale(0.94); }

  /* ---------- Detail screen ---------- */
  #detailScreen {
    position: fixed; inset: 0;
    background: var(--bg);
    z-index: 30;
    display: flex;
    flex-direction: column;
    transform: translateX(100%);
    transition: transform 0.3s cubic-bezier(.22,1,.36,1);
  }
  #detailScreen.show { transform: translateX(0); }
  .detail-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 16px;
    padding-top: max(16px, env(safe-area-inset-top));
    border-bottom: 1px solid var(--line);
  }
  .round-btn {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: var(--surface);
    border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-dim);
    cursor: pointer;
    font-size: 15px;
  }
  .round-btn:active { background: var(--surface-2); }
  .round-btn.danger { color: var(--danger); }

  .detail-body { flex: 1; overflow-y: auto; padding: 24px 20px 110px; }
  .detail-hero { display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 26px; }
  .detail-hero .emoji { font-size: 30px; margin-bottom: 8px; }
  .detail-hero .name { font-size: 20px; font-weight: 700; margin-bottom: 14px; }

  .big-ring { position: relative; width: 168px; height: 168px; }
  .big-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .big-ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .big-ring-center .pct { font-size: 26px; font-weight: 800; }
  .big-ring-center .amt { font-size: 12px; color: var(--ink-dim); margin-top: 3px; }

  .streak-hero { display: flex; flex-direction: column; align-items: center; }
  .streak-hero .flame { font-size: 40px; }
  .streak-hero .count { font-size: 40px; font-weight: 800; color: var(--amber); line-height: 1; margin-top: 4px; }
  .streak-hero .label { font-size: 12.5px; color: var(--ink-dim); margin-top: 4px; }
  .streak-hero .best { font-size: 12px; color: var(--ink-dim); margin-top: 10px; }

  .checkin-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 22px; width: 100%; max-width: 260px; }
  .checkin-grid .cell { aspect-ratio: 1; border-radius: 7px; background: var(--surface-2); border: 1px solid var(--line); }
  .checkin-grid .cell.on { background: var(--amber); border-color: var(--amber); }

  .action-btn {
    width: 100%;
    padding: 15px;
    border-radius: 16px;
    border: none;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 22px;
  }
  .action-btn.green { background: var(--green); color: #0A2419; }
  .action-btn.amber { background: var(--amber); color: #2A1B05; }
  .action-btn:active { filter: brightness(0.92); }
  .action-btn.done { background: var(--surface-2); color: var(--ink-dim); border: 1px solid var(--line); }

  .section-label {
    font-size: 11px;
    color: var(--ink-dim);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin: 26px 0 10px;
  }
  .entry-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 14px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    margin-bottom: 8px;
    font-size: 13.5px;
  }
  .entry-row .amt { font-weight: 700; color: var(--green); }
  .entry-row .date { color: var(--ink-dim); font-size: 12px; }
  .entry-row .note { color: var(--ink-dim); font-size: 12.5px; margin-top: 2px; }

  .reminder-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px;
    margin-top: 26px;
  }
  .reminder-row .label-text { font-size: 14px; font-weight: 600; }
  .reminder-row .sub-text { font-size: 12px; color: var(--ink-dim); margin-top: 2px; }
  .switch { position: relative; width: 46px; height: 27px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch-track {
    position: absolute; inset: 0;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 20px;
    transition: background 0.2s;
    cursor: pointer;
  }
  .switch-track::after {
    content: '';
    position: absolute;
    width: 21px; height: 21px;
    border-radius: 50%;
    background: var(--ink-dim);
    top: 2px; left: 2px;
    transition: transform 0.2s, background 0.2s;
  }
  .switch input:checked + .switch-track { background: var(--amber-dim); border-color: var(--amber-dim); }
  .switch input:checked + .switch-track::after { transform: translateX(19px); background: var(--amber); }
  .time-input {
    margin-top: 10px;
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    color: var(--ink);
    font-size: 14px;
    font-family: inherit;
  }

  /* ---------- Overlays / sheets (shared) ---------- */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(10,12,16,0.72);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 50;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .sheet {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 20px 20px 0 0;
    width: 100%;
    max-width: 480px;
    padding: 22px 20px;
    padding-bottom: max(22px, env(safe-area-inset-bottom));
    transform: translateY(24px);
    transition: transform 0.32s cubic-bezier(.22,1,.36,1);
  }
  .overlay.show .sheet { transform: translateY(0); }
  .sheet h3 { font-size: 18px; font-weight: 700; margin-bottom: 18px; }

  label { font-size: 11px; color: var(--ink-dim); display: block; margin-bottom: 7px; margin-top: 16px; text-transform: uppercase; letter-spacing: 0.05em; }
  label:first-of-type { margin-top: 0; }
  input[type="text"], input[type="number"], input[type="time"] {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--ink);
    font-size: 15px;
    font-family: inherit;
  }
  input:focus { outline: none; border-color: var(--ink-dim); }

  .type-toggle { display: flex; gap: 8px; }
  .type-toggle button {
    flex: 1;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--ink-dim);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .type-toggle button.active.savings { background: var(--green-dim); border-color: var(--green); color: var(--green); }
  .type-toggle button.active.streak { background: var(--amber-dim); border-color: var(--amber); color: var(--amber); }

  .emoji-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .emoji-row button {
    width: 42px; height: 42px;
    border-radius: 12px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    font-size: 19px;
    cursor: pointer;
  }
  .emoji-row button.active { border-color: var(--ink); background: var(--surface); }

  .sheet-actions { display: flex; gap: 10px; margin-top: 22px; }
  .btn { flex: 1; padding: 14px; border-radius: 13px; border: none; font-size: 14.5px; font-weight: 700; cursor: pointer; }
  .btn-primary { background: var(--ink); color: #14171C; }
  .btn-ghost { background: transparent; border: 1px solid var(--line); color: var(--ink-dim); }
</style>
</head>
<body>

<header>
  <h1>Seeking</h1>
  <div class="stats" id="statsLine">No goals yet</div>
</header>

<main id="home"></main>

<button class="fab" id="fabAdd" aria-label="Add goal">+</button>

<!-- Detail screen -->
<div id="detailScreen">
  <div class="detail-header">
    <button class="round-btn" id="backBtn" aria-label="Back">←</button>
    <button class="round-btn danger" id="deleteGoalBtn" aria-label="Delete goal">🗑</button>
  </div>
  <div class="detail-body" id="detailBody"></div>
</div>

<!-- Add goal sheet -->
<div class="overlay" id="addOverlay">
  <div class="sheet">
    <h3>New goal</h3>

    <label style="margin-top:0;">Type</label>
    <div class="type-toggle">
      <button type="button" class="savings active" id="typeSavingsBtn">💰 Savings</button>
      <button type="button" class="streak" id="typeStreakBtn">🔥 Streak</button>
    </div>

    <label for="goalNameInput">Name</label>
    <input type="text" id="goalNameInput" placeholder="e.g. Japan trip" />

    <div id="targetField">
      <label for="goalTargetInput">Target amount</label>
      <input type="number" id="goalTargetInput" placeholder="2000" inputmode="decimal" />
    </div>

    <label>Icon</label>
    <div class="emoji-row" id="emojiRow"></div>

    <div class="sheet-actions">
      <button class="btn btn-ghost" id="cancelAddBtn" type="button">Cancel</button>
      <button class="btn btn-primary" id="saveGoalBtn" type="button">Create goal</button>
    </div>
  </div>
</div>

<!-- Log savings sheet -->
<div class="overlay" id="logOverlay">
  <div class="sheet">
    <h3>Log a contribution</h3>
    <label style="margin-top:0;" for="logAmountInput">Amount</label>
    <input type="number" id="logAmountInput" placeholder="100" inputmode="decimal" />
    <label for="logNoteInput">Note (optional)</label>
    <input type="text" id="logNoteInput" placeholder="Freelance payment" />
    <div class="sheet-actions">
      <button class="btn btn-ghost" id="cancelLogBtn" type="button">Cancel</button>
      <button class="btn btn-primary" id="saveLogBtn" type="button">Add</button>
    </div>
  </div>
</div>

<script>
(function () {
  const STORAGE_GOALS = 'seeking_goals';
  const RING_R = 24; // matches small ring viewBox radius
  const RING_C = 2 * Math.PI * RING_R;
  const BIG_RING_R = 72;
  const BIG_RING_C = 2 * Math.PI * BIG_RING_R;
  const EMOJIS = ['🎯', '💰', '✈️', '🏠', '🚗', '📚', '💪', '🧘'];

  const homeEl = document.getElementById('home');
  const statsLine = document.getElementById('statsLine');
  const fabAdd = document.getElementById('fabAdd');

  const detailScreen = document.getElementById('detailScreen');
  const detailBody = document.getElementById('detailBody');
  const backBtn = document.getElementById('backBtn');
  const deleteGoalBtn = document.getElementById('deleteGoalBtn');

  const addOverlay = document.getElementById('addOverlay');
  const typeSavingsBtn = document.getElementById('typeSavingsBtn');
  const typeStreakBtn = document.getElementById('typeStreakBtn');
  const goalNameInput = document.getElementById('goalNameInput');
  const targetField = document.getElementById('targetField');
  const goalTargetInput = document.getElementById('goalTargetInput');
  const emojiRow = document.getElementById('emojiRow');
  const cancelAddBtn = document.getElementById('cancelAddBtn');
  const saveGoalBtn = document.getElementById('saveGoalBtn');

  const logOverlay = document.getElementById('logOverlay');
  const logAmountInput = document.getElementById('logAmountInput');
  const logNoteInput = document.getElementById('logNoteInput');
  const cancelLogBtn = document.getElementById('cancelLogBtn');
  const saveLogBtn = document.getElementById('saveLogBtn');

  let goals = JSON.parse(localStorage.getItem(STORAGE_GOALS) || '[]');
  let newGoalType = 'savings';
  let newGoalEmoji = EMOJIS[0];
  let activeGoalId = null;

  function haptic(style) {
    try { window.Capacitor?.Plugins?.Haptics?.impact({ style: style || 'Light' }); } catch (e) {}
  }

  function saveGoals() {
    localStorage.setItem(STORAGE_GOALS, JSON.stringify(goals));
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function todayStr() {
    return new Date().toISOString().slice(0, 10);
  }

  function daysAgoStr(n) {
    const d = new Date();
    d.setDate(d.getDate() - n);
    return d.toISOString().slice(0, 10);
  }

  function currentStreak(entries) {
    let count = 0;
    let cursor = new Date();
    while (true) {
      const key = cursor.toISOString().slice(0, 10);
      if (entries.includes(key)) {
        count++;
        cursor.setDate(cursor.getDate() - 1);
      } else {
        break;
      }
    }
    return count;
  }

  function bestStreak(entries) {
    const sorted = [...new Set(entries)].sort();
    let best = 0, run = 0, prev = null;
    for (const d of sorted) {
      if (prev) {
        const diff = (new Date(d) - new Date(prev)) / 86400000;
        run = diff === 1 ? run + 1 : 1;
      } else {
        run = 1;
      }
      best = Math.max(best, run);
      prev = d;
    }
    return best;
  }

  // ---------- Home rendering ----------
  function renderStats() {
    if (goals.length === 0) { statsLine.textContent = 'No goals yet'; return; }
    const month = new Date().toISOString().slice(0, 7);
    let savedThisMonth = 0;
    let best = 0;
    goals.forEach(g => {
      if (g.type === 'savings') {
        g.entries.forEach(e => { if (e.date.startsWith(month)) savedThisMonth += e.amount; });
      } else {
        best = Math.max(best, currentStreak(g.entries));
      }
    });
    const parts = [goals.length + ' goal' + (goals.length === 1 ? '' : 's')];
    if (savedThisMonth > 0) parts.push('$' + savedThisMonth.toLocaleString() + ' saved this month');
    if (best > 0) parts.push(best + '-day best streak');
    statsLine.textContent = parts.join(' · ');
  }

  function renderHome() {
    renderStats();
    homeEl.innerHTML = '';
    if (goals.length === 0) {
      homeEl.innerHTML = `
        <div class="empty-state">
          <div class="glyph">🎯</div>
          <h2>Start seeking</h2>
          <p>Add a savings goal or a daily streak to start tracking progress.</p>
        </div>`;
      return;
    }
    goals.forEach(g => homeEl.appendChild(buildGoalCard(g)));
  }

  function buildGoalCard(g) {
    const card = document.createElement('div');
    card.className = 'goal-card';
    card.addEventListener('click', () => openDetail(g.id));

    if (g.type === 'savings') {
      const pct = g.target > 0 ? Math.min(1, g.current / g.target) : 0;
      const offset = RING_C * (1 - pct);
      card.innerHTML = `
        <div class="ring-wrap">
          <svg viewBox="0 0 60 60">
            <circle class="ring-bg" cx="30" cy="30" r="${RING_R}" stroke-width="6"></circle>
            <circle class="ring-fill" cx="30" cy="30" r="${RING_R}" stroke-width="6"
              stroke="#3ECF8E" stroke-dasharray="${RING_C}" stroke-dashoffset="${offset}"></circle>
          </svg>
          <div class="ring-emoji">${g.emoji}</div>
        </div>
        <div class="goal-info">
          <div class="name">${escapeHtml(g.name)}</div>
          <div class="sub"><span class="accent-green num">$${g.current.toLocaleString()}</span> of $${g.target.toLocaleString()}</div>
        </div>`;
    } else {
      const streak = currentStreak(g.entries);
      const dots = Array.from({ length: 7 }, (_, i) => {
        const day = daysAgoStr(6 - i);
        return `<div class="d ${g.entries.includes(day) ? 'on' : ''}"></div>`;
      }).join('');
      card.innerHTML = `
        <div class="streak-badge">
          <div class="n num">${streak}</div>
          <div class="u">days</div>
        </div>
        <div class="goal-info">
          <div class="name">${escapeHtml(g.name)}</div>
          <div class="sub"><span class="accent-amber">${g.emoji}</span> daily streak</div>
          <div class="dot-row">${dots}</div>
        </div>`;
    }
    return card;
  }

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // ---------- Detail screen ----------
  function openDetail(id) {
    activeGoalId = id;
    renderDetail();
    detailScreen.classList.add('show');
  }
  function closeDetail() {
    detailScreen.classList.remove('show');
    activeGoalId = null;
  }
  backBtn.addEventListener('click', closeDetail);

  function getActiveGoal() {
    return goals.find(g => g.id === activeGoalId);
  }

  function renderDetail() {
    const g = getActiveGoal();
    if (!g) return;

    if (g.type === 'savings') {
      const pct = g.target > 0 ? Math.min(1, g.current / g.target) : 0;
      const offset = BIG_RING_C * (1 - pct);
      const reached = g.current >= g.target && g.target > 0;
      detailBody.innerHTML = `
        <div class="detail-hero">
          <div class="emoji">${g.emoji}</div>
          <div class="name">${escapeHtml(g.name)}</div>
          <div class="big-ring">
            <svg viewBox="0 0 168 168">
              <circle class="ring-bg" cx="84" cy="84" r="${BIG_RING_R}" stroke-width="12"></circle>
              <circle class="ring-fill" cx="84" cy="84" r="${BIG_RING_R}" stroke-width="12"
                stroke="#3ECF8E" stroke-dasharray="${BIG_RING_C}" stroke-dashoffset="${offset}"></circle>
            </svg>
            <div class="big-ring-center">
              <div class="pct num">${Math.round(pct * 100)}%</div>
              <div class="amt num">$${g.current.toLocaleString()} / $${g.target.toLocaleString()}</div>
            </div>
          </div>
          <button class="action-btn green" id="logBtn">${reached ? '🎉 Add more' : '+ Log contribution'}</button>
        </div>
        <div class="section-label">History</div>
        <div id="entryList">${renderEntryList(g)}</div>
        ${renderReminderRow(g)}
      `;
      document.getElementById('logBtn').addEventListener('click', openLogSheet);
    } else {
      const streak = currentStreak(g.entries);
      const best = bestStreak(g.entries);
      const doneToday = g.entries.includes(todayStr());
      const cells = Array.from({ length: 28 }, (_, i) => {
        const day = daysAgoStr(27 - i);
        return `<div class="cell ${g.entries.includes(day) ? 'on' : ''}"></div>`;
      }).join('');
      detailBody.innerHTML = `
        <div class="detail-hero">
          <div class="emoji">${g.emoji}</div>
          <div class="name">${escapeHtml(g.name)}</div>
          <div class="streak-hero">
            <div class="flame">🔥</div>
            <div class="count num">${streak}</div>
            <div class="label">day streak</div>
            <div class="best num">Best: ${best} days</div>
          </div>
          <div class="checkin-grid">${cells}</div>
          <button class="action-btn ${doneToday ? 'done' : 'amber'}" id="checkinBtn">${doneToday ? '✓ Done for today' : "Mark today done"}</button>
        </div>
        ${renderReminderRow(g)}
      `;
      document.getElementById('checkinBtn').addEventListener('click', () => {
        toggleToday(g);
      });
    }

    wireReminderRow(g);
  }

  function renderEntryList(g) {
    if (g.entries.length === 0) {
      return `<div style="color:var(--ink-dim); font-size:13px;">No contributions logged yet.</div>`;
    }
    return [...g.entries].reverse().map(e => `
      <div class="entry-row">
        <div>
          <div>${e.note ? escapeHtml(e.note) : 'Contribution'}</div>
          <div class="date">${formatDate(e.date)}</div>
        </div>
        <div class="amt num">+$${e.amount.toLocaleString()}</div>
      </div>
    `).join('');
  }

  function formatDate(d) {
    const date = new Date(d + 'T00:00:00');
    return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }

  function renderReminderRow(g) {
    return `
      <div class="reminder-row">
        <div>
          <div class="label-text">Daily reminder</div>
          <div class="sub-text" id="reminderSub">${g.reminderEnabled ? 'Reminding at ' + (g.reminderTime || '09:00') : 'Off'}</div>
          ${g.reminderEnabled ? `<input type="time" class="time-input" id="reminderTime" value="${g.reminderTime || '09:00'}" />` : ''}
        </div>
        <label class="switch">
          <input type="checkbox" id="reminderToggle" ${g.reminderEnabled ? 'checked' : ''} />
          <span class="switch-track"></span>
        </label>
      </div>`;
  }

  function wireReminderRow(g) {
    const toggle = document.getElementById('reminderToggle');
    if (!toggle) return;
    toggle.addEventListener('change', () => {
      g.reminderEnabled = toggle.checked;
      if (!g.reminderTime) g.reminderTime = '09:00';
      saveGoals();
      scheduleReminder(g);
      renderDetail();
      haptic('Light');
    });
    const timeInput = document.getElementById('reminderTime');
    if (timeInput) {
      timeInput.addEventListener('change', () => {
        g.reminderTime = timeInput.value;
        saveGoals();
        scheduleReminder(g);
        document.getElementById('reminderSub').textContent = 'Reminding at ' + g.reminderTime;
      });
    }
  }

  // Schedules (or cancels) a native daily notification if @capacitor/local-notifications
  // is installed; silently does nothing otherwise (e.g. web preview).
  function scheduleReminder(g) {
    try {
      const LN = window.Capacitor?.Plugins?.LocalNotifications;
      if (!LN) return;
      const notifId = hashId(g.id);
      LN.cancel({ notifications: [{ id: notifId }] });
      if (g.reminderEnabled) {
        const [h, m] = (g.reminderTime || '09:00').split(':').map(Number);
        LN.schedule({
          notifications: [{
            id: notifId,
            title: 'Seeking',
            body: g.type === 'savings' ? `Add a contribution to "${g.name}"` : `Keep your "${g.name}" streak alive`,
            schedule: { on: { hour: h, minute: m }, repeats: true }
          }]
        });
      }
    } catch (e) { /* no-op */ }
  }
  function hashId(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
    return h % 1000000;
  }

  function toggleToday(g) {
    const today = todayStr();
    const idx = g.entries.indexOf(today);
    if (idx === -1) { g.entries.push(today); haptic('Medium'); }
    else { g.entries.splice(idx, 1); haptic('Light'); }
    saveGoals();
    renderDetail();
    renderHome();
  }

  deleteGoalBtn.addEventListener('click', () => {
    const g = getActiveGoal();
    if (!g) return;
    if (!confirm(`Delete "${g.name}"? This can't be undone.`)) return;
    goals = goals.filter(x => x.id !== g.id);
    saveGoals();
    closeDetail();
    renderHome();
  });

  // ---------- Add goal sheet ----------
  emojiRow.innerHTML = EMOJIS.map((e, i) =>
    `<button type="button" data-e="${e}" class="${i === 0 ? 'active' : ''}">${e}</button>`
  ).join('');
  emojiRow.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      newGoalEmoji = btn.dataset.e;
      emojiRow.querySelectorAll('button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });
  });

  typeSavingsBtn.addEventListener('click', () => setNewGoalType('savings'));
  typeStreakBtn.addEventListener('click', () => setNewGoalType('streak'));
  function setNewGoalType(t) {
    newGoalType = t;
    typeSavingsBtn.classList.toggle('active', t === 'savings');
    typeStreakBtn.classList.toggle('active', t === 'streak');
    targetField.style.display = t === 'savings' ? 'block' : 'none';
  }

  fabAdd.addEventListener('click', () => {
    goalNameInput.value = '';
    goalTargetInput.value = '';
    setNewGoalType('savings');
    newGoalEmoji = EMOJIS[0];
    emojiRow.querySelectorAll('button').forEach((b, i) => b.classList.toggle('active', i === 0));
    addOverlay.classList.add('show');
  });
  cancelAddBtn.addEventListener('click', () => addOverlay.classList.remove('show'));
  addOverlay.addEventListener('click', (e) => { if (e.target === addOverlay) addOverlay.classList.remove('show'); });

  saveGoalBtn.addEventListener('click', () => {
    const name = goalNameInput.value.trim();
    if (!name) { goalNameInput.focus(); return; }
    const goal = {
      id: uid(),
      type: newGoalType,
      name: name,
      emoji: newGoalEmoji,
      reminderEnabled: false,
      reminderTime: '09:00'
    };
    if (newGoalType === 'savings') {
      const target = parseFloat(goalTargetInput.value) || 0;
      goal.target = target;
      goal.current = 0;
      goal.entries = [];
    } else {
      goal.entries = [];
    }
    goals.push(goal);
    saveGoals();
    addOverlay.classList.remove('show');
    renderHome();
    haptic('Medium');
  });

  // ---------- Log contribution sheet ----------
  function openLogSheet() {
    logAmountInput.value = '';
    logNoteInput.value = '';
    logOverlay.classList.add('show');
  }
  cancelLogBtn.addEventListener('click', () => logOverlay.classList.remove('show'));
  logOverlay.addEventListener('click', (e) => { if (e.target === logOverlay) logOverlay.classList.remove('show'); });

  saveLogBtn.addEventListener('click', () => {
    const amount = parseFloat(logAmountInput.value);
    if (!amount || amount <= 0) { logAmountInput.focus(); return; }
    const g = getActiveGoal();
    if (!g) return;
    g.entries.push({ date: todayStr(), amount: amount, note: logNoteInput.value.trim() });
    g.current = g.entries.reduce((sum, e) => sum + e.amount, 0);
    saveGoals();
    logOverlay.classList.remove('show');
    renderDetail();
    renderHome();
    haptic('Medium');
  });

  // ---------- Boot ----------
  renderHome();
  if (window.Capacitor) console.log('Seeking running natively on Android');
})();
</script>

</body>
</html>

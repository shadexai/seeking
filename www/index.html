<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Seeking</title>
<link rel="manifest" href="manifest.json" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #12151B; overscroll-behavior: none; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: #ECEDEF;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
    animation: appIn 0.4s ease;
    position: relative;
    overflow: hidden;
  }
  @keyframes appIn { from { opacity: 0; } to { opacity: 1; } }

  :root {
    --bg: #12151B;
    --surface: #1B1F27;
    --surface-2: #232833;
    --line: #2A2F3B;
    --ink: #ECEDEF;
    --ink-dim: #8A90A0;
    --green: #3ECF8E;
    --green-dim: #1C4A38;
    --amber: #E8A33D;
    --amber-dim: #5C3F1B;
    --danger: #E0684F;
  }
  .num { font-variant-numeric: tabular-nums; }

  /* ---------- Header ---------- */
  header {
    padding: 18px 20px 14px;
    padding-top: max(18px, env(safe-area-inset-top));
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
  }
  header h1 {
    font-size: 23px;
    font-weight: 800;
    letter-spacing: -0.01em;
  }
  header .stats {
    font-size: 12.5px;
    color: var(--ink-dim);
    margin-top: 4px;
  }
  header .round-btn { margin-top: 2px; }

  /* ---------- Home / goal list ---------- */
  #home { flex: 1; overflow-y: auto; padding: 16px 16px 100px; }

  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--ink-dim);
    padding: 60px 30px;
    gap: 8px;
  }
  .empty-state .glyph { font-size: 34px; margin-bottom: 6px; }
  .empty-state h2 { color: var(--ink); font-size: 18px; font-weight: 700; }
  .empty-state p { font-size: 13.5px; line-height: 1.5; max-width: 240px; }

  .goal-card {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 14px 16px;
    margin-bottom: 12px;
    cursor: pointer;
    animation: cardIn 0.3s cubic-bezier(.22,1,.36,1) both;
  }
  .goal-card:active { background: var(--surface-2); }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .ring-wrap { position: relative; width: 54px; height: 54px; flex-shrink: 0; }
  .ring-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: var(--surface-2); }
  .ring-fill { fill: none; stroke-linecap: round; transition: stroke-dashoffset 0.6s cubic-bezier(.22,1,.36,1); }
  .ring-emoji { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 18px; }

  .streak-badge {
    width: 54px; height: 54px;
    border-radius: 50%;
    background: var(--amber-dim);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .streak-badge .n { font-size: 17px; font-weight: 800; color: var(--amber); line-height: 1; }
  .streak-badge .u { font-size: 8px; color: var(--amber); opacity: 0.8; letter-spacing: 0.04em; text-transform: uppercase; margin-top: 1px; }

  .goal-info { flex: 1; min-width: 0; }
  .goal-info .name { font-size: 15.5px; font-weight: 600; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .goal-info .sub { font-size: 12.5px; color: var(--ink-dim); }
  .goal-info .sub .accent-green { color: var(--green); font-weight: 600; }
  .goal-info .sub .accent-amber { color: var(--amber); font-weight: 600; }

  .dot-row { display: flex; gap: 3px; margin-top: 6px; }
  .dot-row .d { width: 6px; height: 6px; border-radius: 50%; background: var(--surface-2); }
  .dot-row .d.on { background: var(--amber); }

  /* ---------- FAB ---------- */
  .fab {
    position: fixed;
    right: 20px;
    bottom: max(24px, env(safe-area-inset-bottom));
    width: 58px; height: 58px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--green), var(--amber));
    border: none;
    color: #10130F;
    font-size: 26px;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    cursor: pointer;
    z-index: 15;
  }
  .fab:active { transform: scale(0.94); }

  /* ---------- Detail screen ---------- */
  #detailScreen {
    position: fixed; inset: 0;
    background: var(--bg);
    z-index: 30;
    display: flex;
    flex-direction: column;
    transform: translateX(100%);
    transition: transform 0.3s cubic-bezier(.22,1,.36,1);
  }
  #detailScreen.show { transform: translateX(0); }
  .detail-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 16px;
    padding-top: max(16px, env(safe-area-inset-top));
    border-bottom: 1px solid var(--line);
  }
  .round-btn {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: var(--surface);
    border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-dim);
    cursor: pointer;
    font-size: 15px;
  }
  .round-btn:active { background: var(--surface-2); }
  .round-btn.danger { color: var(--danger); }

  .detail-body { flex: 1; overflow-y: auto; padding: 24px 20px 110px; }
  .detail-hero { display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 26px; }
  .detail-hero .emoji { font-size: 30px; margin-bottom: 8px; }
  .detail-hero .name { font-size: 20px; font-weight: 700; margin-bottom: 14px; }

  .big-ring { position: relative; width: 168px; height: 168px; }
  .big-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .big-ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .big-ring-center .pct { font-size: 26px; font-weight: 800; }
  .big-ring-center .amt { font-size: 12px; color: var(--ink-dim); margin-top: 3px; }

  .streak-hero { display: flex; flex-direction: column; align-items: center; }
  .streak-hero .flame { font-size: 40px; }
  .streak-hero .count { font-size: 40px; font-weight: 800; color: var(--amber); line-height: 1; margin-top: 4px; }
  .streak-hero .label { font-size: 12.5px; color: var(--ink-dim); margin-top: 4px; }
  .streak-hero .best { font-size: 12px; color: var(--ink-dim); margin-top: 10px; }

  .checkin-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 22px; width: 100%; max-width: 260px; }
  .checkin-grid .cell { aspect-ratio: 1; border-radius: 7px; background: var(--surface-2); border: 1px solid var(--line); }
  .checkin-grid .cell.on { background: var(--amber); border-color: var(--amber); }

  .action-btn {
    width: 100%;
    padding: 15px;
    border-radius: 16px;
    border: none;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 22px;
  }
  .action-btn.green { background: var(--green); color: #0A2419; }
  .action-btn.amber { background: var(--amber); color: #2A1B05; }
  .action-btn:active { filter: brightness(0.92); }
  .action-btn.done { background: var(--surface-2); color: var(--ink-dim); border: 1px solid var(--line); }

  .section-label {
    font-size: 11px;
    color: var(--ink-dim);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin: 26px 0 10px;
  }
  .entry-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 14px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    margin-bottom: 8px;
    font-size: 13.5px;
  }
  .entry-row .amt { font-weight: 700; color: var(--green); }
  .entry-row .date { color: var(--ink-dim); font-size: 12px; }
  .entry-row .note { color: var(--ink-dim); font-size: 12.5px; margin-top: 2px; }

  .reminder-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px;
    margin-top: 26px;
  }
  .reminder-row .label-text { font-size: 14px; font-weight: 600; }
  .reminder-row .sub-text { font-size: 12px; color: var(--ink-dim); margin-top: 2px; }
  .switch { position: relative; width: 46px; height: 27px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch-track {
    position: absolute; inset: 0;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 20px;
    transition: background 0.2s;
    cursor: pointer;
  }
  .switch-track::after {
    content: '';
    position: absolute;
    width: 21px; height: 21px;
    border-radius: 50%;
    background: var(--ink-dim);
    top: 2px; left: 2px;
    transition: transform 0.2s, background 0.2s;
  }
  .switch input:checked + .switch-track { background: var(--amber-dim); border-color: var(--amber-dim); }
  .switch input:checked + .switch-track::after { transform: translateX(19px); background: var(--amber); }
  .time-input {
    margin-top: 10px;
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    color: var(--ink);
    font-size: 14px;
    font-family: inherit;
  }

  /* ---------- Overlays / sheets (shared) ---------- */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(10,12,16,0.72);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 50;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .sheet {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 20px 20px 0 0;
    width: 100%;
    max-width: 480px;
    padding: 22px 20px;
    padding-bottom: max(22px, env(safe-area-inset-bottom));
    transform: translateY(24px);
    transition: transform 0.32s cubic-bezier(.22,1,.36,1);
  }
  .overlay.show .sheet { transform: translateY(0); }
  .sheet { transition: transform 0.32s cubic-bezier(.22,1,.36,1), padding-bottom 0.15s ease; }
  .sheet h3 { font-size: 18px; font-weight: 700; margin-bottom: 18px; }

  .field-error {
    font-size: 11.5px;
    color: var(--danger);
    margin-top: 6px;
    display: none;
    line-height: 1.4;
  }
  .field-error.show { display: block; }
  input.invalid { border-color: var(--danger); }

  label { font-size: 11px; color: var(--ink-dim); display: block; margin-bottom: 7px; margin-top: 16px; text-transform: uppercase; letter-spacing: 0.05em; }
  label:first-of-type { margin-top: 0; }
  input[type="text"], input[type="number"], input[type="time"] {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--ink);
    font-size: 15px;
    font-family: inherit;
  }
  input:focus { outline: none; border-color: var(--ink-dim); }

  .type-toggle { display: flex; gap: 8px; }
  .type-toggle button {
    flex: 1;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--ink-dim);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .type-toggle button.active.savings { background: var(--green-dim); border-color: var(--green); color: var(--green); }
  .type-toggle button.active.streak { background: var(--amber-dim); border-color: var(--amber); color: var(--amber); }

  .emoji-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .emoji-row button {
    width: 42px; height: 42px;
    border-radius: 12px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    font-size: 19px;
    cursor: pointer;
  }
  .emoji-row button.active { border-color: var(--ink); background: var(--surface); }

  .currency-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .currency-grid button {
    padding: 12px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--ink-dim);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .currency-grid button.active { background: var(--surface); border-color: var(--ink); color: var(--ink); }
  .settings-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 13px 15px;
    margin-top: 10px;
    cursor: pointer;
  }
  .settings-row .t { font-size: 14px; font-weight: 600; }
  .settings-row .s { font-size: 11.5px; color: var(--ink-dim); margin-top: 2px; }
  .settings-row .chev { color: var(--ink-dim); font-size: 14px; }

  .sheet-actions { display: flex; gap: 10px; margin-top: 22px; }
  .btn { flex: 1; padding: 14px; border-radius: 13px; border: none; font-size: 14.5px; font-weight: 700; cursor: pointer; }
  .btn-primary { background: var(--ink); color: #14171C; }
  .btn-ghost { background: transparent; border: 1px solid var(--line); color: var(--ink-dim); }
</style>
</head>
<body>

<header>
  <div>
    <h1>Seeking</h1>
    <div class="stats" id="statsLine">No goals yet</div>
  </div>
  <button class="round-btn" id="openSettingsBtn" aria-label="Settings">⚙</button>
</header>

<main id="home"></main>

<button class="fab" id="fabAdd" aria-label="Add goal">+</button>

<!-- Detail screen -->
<div id="detailScreen">
  <div class="detail-header">
    <button class="round-btn" id="backBtn" aria-label="Back">←</button>
    <div style="display:flex; gap:10px;">
      <button class="round-btn" id="editGoalBtn" aria-label="Edit goal">✏️</button>
      <button class="round-btn danger" id="deleteGoalBtn" aria-label="Delete goal">🗑</button>
    </div>
  </div>
  <div class="detail-body" id="detailBody"></div>
</div>

<!-- Add / Edit goal sheet -->
<div class="overlay" id="addOverlay">
  <div class="sheet">
    <h3 id="goalSheetTitle">New goal</h3>

    <div id="typeSection">
      <label style="margin-top:0;">Type</label>
      <div class="type-toggle">
        <button type="button" class="savings active" id="typeSavingsBtn">💰 Savings</button>
        <button type="button" class="streak" id="typeStreakBtn">🔥 Streak</button>
      </div>
    </div>

    <label for="goalNameInput" id="goalNameLabel">Name</label>
    <input type="text" id="goalNameInput" placeholder="e.g. Japan trip" maxlength="60" />
    <div class="field-error" id="goalNameError">Please enter a name.</div>

    <div id="targetField">
      <label for="goalTargetInput">Target amount</label>
      <input type="number" id="goalTargetInput" placeholder="2000" inputmode="decimal" min="0.01" step="0.01" />
      <div class="field-error" id="goalTargetError">Enter a target greater than 0.</div>
    </div>

    <label>Icon</label>
    <div class="emoji-row" id="emojiRow"></div>

    <div class="sheet-actions">
      <button class="btn btn-ghost" id="cancelAddBtn" type="button">Cancel</button>
      <button class="btn btn-primary" id="saveGoalBtn" type="button">Create goal</button>
    </div>
  </div>
</div>

<!-- Log savings sheet -->
<div class="overlay" id="logOverlay">
  <div class="sheet">
    <h3>Log a contribution</h3>
    <label style="margin-top:0;" for="logAmountInput">Amount</label>
    <input type="number" id="logAmountInput" placeholder="100" inputmode="decimal" min="0.01" step="0.01" />
    <div class="field-error" id="logAmountError">Enter an amount greater than 0.</div>
    <label for="logNoteInput">Note (optional)</label>
    <input type="text" id="logNoteInput" placeholder="Freelance payment" maxlength="80" />
    <div class="sheet-actions">
      <button class="btn btn-ghost" id="cancelLogBtn" type="button">Cancel</button>
      <button class="btn btn-primary" id="saveLogBtn" type="button">Add</button>
    </div>
  </div>
</div>

<!-- Settings sheet -->
<div class="overlay" id="settingsOverlay">
  <div class="sheet">
    <h3>Settings</h3>

    <label style="margin-top:0;">Currency</label>
    <div class="currency-grid" id="currencyGrid">
      <button type="button" data-c="USD">USD ($)</button>
      <button type="button" data-c="EUR">EUR (€)</button>
      <button type="button" data-c="GBP">GBP (£)</button>
      <button type="button" data-c="PKR">PKR (Rs)</button>
    </div>

    <label>Data</label>
    <div class="settings-row" id="exportBtn">
      <div>
        <div class="t">Export backup</div>
        <div class="s">Save all goals as a JSON file</div>
      </div>
      <div class="chev">↗</div>
    </div>
    <div class="settings-row" id="importBtn">
      <div>
        <div class="t">Import backup</div>
        <div class="s">Restore from a JSON file</div>
      </div>
      <div class="chev">↓</div>
    </div>
    <input type="file" id="importInput" accept="application/json,.json" hidden />

    <div class="sheet-actions">
      <button class="btn btn-primary" id="closeSettingsBtn" type="button" style="flex:1;">Done</button>
    </div>
  </div>
</div>

<script>

(function () {
  const STORAGE_GOALS = 'seeking_goals';
  const STORAGE_CURRENCY = 'seeking_currency';
  const NOTIF_CHANNEL_ID = 'seeking_reminders';
  const RING_R = 24; // matches small ring viewBox radius
  const RING_C = 2 * Math.PI * RING_R;
  const BIG_RING_R = 72;
  const BIG_RING_C = 2 * Math.PI * BIG_RING_R;
  const EMOJIS = ['🎯', '💰', '✈️', '🏠', '🚗', '📚', '💪', '🧘'];
  const CURRENCIES = {
    USD: { locale: 'en-US', code: 'USD' },
    EUR: { locale: 'de-DE', code: 'EUR' },
    GBP: { locale: 'en-GB', code: 'GBP' },
    PKR: { locale: 'en-PK', code: 'PKR' }
  };

  const headerEl = document.querySelector('header');
  const homeEl = document.getElementById('home');
  const statsLine = document.getElementById('statsLine');
  const fabAdd = document.getElementById('fabAdd');
  const openSettingsBtn = document.getElementById('openSettingsBtn');

  const detailScreen = document.getElementById('detailScreen');
  const detailBody = document.getElementById('detailBody');
  const backBtn = document.getElementById('backBtn');
  const editGoalBtn = document.getElementById('editGoalBtn');
  const deleteGoalBtn = document.getElementById('deleteGoalBtn');

  const addOverlay = document.getElementById('addOverlay');
  const goalSheetTitle = document.getElementById('goalSheetTitle');
  const typeSection = document.getElementById('typeSection');
  const typeSavingsBtn = document.getElementById('typeSavingsBtn');
  const typeStreakBtn = document.getElementById('typeStreakBtn');
  const goalNameInput = document.getElementById('goalNameInput');
  const goalNameError = document.getElementById('goalNameError');
  const targetField = document.getElementById('targetField');
  const goalTargetInput = document.getElementById('goalTargetInput');
  const goalTargetError = document.getElementById('goalTargetError');
  const emojiRow = document.getElementById('emojiRow');
  const cancelAddBtn = document.getElementById('cancelAddBtn');
  const saveGoalBtn = document.getElementById('saveGoalBtn');

  const logOverlay = document.getElementById('logOverlay');
  const logAmountInput = document.getElementById('logAmountInput');
  const logAmountError = document.getElementById('logAmountError');
  const logNoteInput = document.getElementById('logNoteInput');
  const cancelLogBtn = document.getElementById('cancelLogBtn');
  const saveLogBtn = document.getElementById('saveLogBtn');

  const settingsOverlay = document.getElementById('settingsOverlay');
  const currencyGrid = document.getElementById('currencyGrid');
  const exportBtn = document.getElementById('exportBtn');
  const importBtn = document.getElementById('importBtn');
  const importInput = document.getElementById('importInput');
  const closeSettingsBtn = document.getElementById('closeSettingsBtn');

  let goals = JSON.parse(localStorage.getItem(STORAGE_GOALS) || '[]');
  let newGoalType = 'savings';
  let newGoalEmoji = EMOJIS[0];
  let activeGoalId = null;
  let editingGoalId = null; // null => the add sheet is in "create" mode

  function haptic(style) {
    try { window.Capacitor?.Plugins?.Haptics?.impact({ style: style || 'Light' }); } catch (e) {}
  }

  function saveGoals() {
    localStorage.setItem(STORAGE_GOALS, JSON.stringify(goals));
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  // ---------- Local calendar date helpers (avoid UTC/toISOString drift) ----------
  function pad2(n) { return String(n).padStart(2, '0'); }
  function localDateStr(d) {
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }
  function todayStr() { return localDateStr(new Date()); }
  function daysAgoStr(n) {
    const d = new Date();
    d.setDate(d.getDate() - n);
    return localDateStr(d);
  }
  function parseLocalDate(s) { return new Date(s + 'T00:00:00'); }

  function currentStreak(entries) {
    let count = 0;
    let cursor = new Date();
    while (true) {
      const key = localDateStr(cursor);
      if (entries.includes(key)) {
        count++;
        cursor.setDate(cursor.getDate() - 1);
      } else {
        break;
      }
    }
    return count;
  }

  function bestStreak(entries) {
    const sorted = [...new Set(entries)].sort();
    let best = 0, run = 0, prev = null;
    for (const d of sorted) {
      if (prev) {
        const diff = (parseLocalDate(d) - parseLocalDate(prev)) / 86400000;
        run = diff === 1 ? run + 1 : 1;
      } else {
        run = 1;
      }
      best = Math.max(best, run);
      prev = d;
    }
    return best;
  }

  // ---------- Currency ----------
  function getCurrency() {
    return localStorage.getItem(STORAGE_CURRENCY) || 'USD';
  }
  function setCurrency(code) {
    if (!CURRENCIES[code]) code = 'USD';
    localStorage.setItem(STORAGE_CURRENCY, code);
  }
  function formatMoney(amount) {
    const n = Number(amount) || 0;
    const meta = CURRENCIES[getCurrency()] || CURRENCIES.USD;
    try {
      return new Intl.NumberFormat(meta.locale, {
        style: 'currency',
        currency: meta.code,
        maximumFractionDigits: (n % 1 === 0) ? 0 : 2
      }).format(n);
    } catch (e) {
      return meta.code + ' ' + n.toLocaleString();
    }
  }
  function refreshCurrencyGrid() {
    const cur = getCurrency();
    currencyGrid.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.c === cur));
  }
  currencyGrid.querySelectorAll('button').forEach(b => {
    b.addEventListener('click', () => {
      setCurrency(b.dataset.c);
      refreshCurrencyGrid();
      renderHome();
      if (activeGoalId) renderDetail();
      haptic('Light');
    });
  });

  // ---------- Validation ----------
  function setFieldError(inputEl, errorEl, show) {
    errorEl.classList.toggle('show', show);
    inputEl.classList.toggle('invalid', show);
  }
  function clearFieldError(inputEl, errorEl) { setFieldError(inputEl, errorEl, false); }
  function validateGoalName(name) {
    const t = name.trim();
    return t.length > 0 && t.length <= 60;
  }
  function validatePositiveAmount(val) {
    const n = parseFloat(val);
    return Number.isFinite(n) && n > 0;
  }

  // Normalizes arbitrary/imported goal data into a safe, well-typed shape.
  function sanitizeGoals(rawList) {
    if (!Array.isArray(rawList)) return [];
    return rawList.map(r => {
      const type = r && r.type === 'streak' ? 'streak' : 'savings';
      const g = {
        id: (r && typeof r.id === 'string' && r.id) ? r.id : uid(),
        type: type,
        name: (r && typeof r.name === 'string' && r.name.trim()) ? r.name.trim().slice(0, 60) : 'Untitled goal',
        emoji: (r && typeof r.emoji === 'string' && r.emoji) ? r.emoji : EMOJIS[0],
        reminderEnabled: !!(r && r.reminderEnabled),
        reminderTime: (r && typeof r.reminderTime === 'string' && /^\d{2}:\d{2}$/.test(r.reminderTime)) ? r.reminderTime : '09:00',
        entries: []
      };
      if (type === 'savings') {
        g.entries = (r && Array.isArray(r.entries)) ? r.entries
          .filter(e => e && typeof e.date === 'string' && Number.isFinite(e.amount) && e.amount > 0)
          .map(e => ({ date: e.date, amount: e.amount, note: typeof e.note === 'string' ? e.note.slice(0, 80) : '' }))
          : [];
        g.target = (r && Number.isFinite(r.target) && r.target > 0) ? r.target : 0;
        g.current = g.entries.reduce((sum, e) => sum + e.amount, 0);
      } else {
        g.entries = (r && Array.isArray(r.entries)) ? r.entries.filter(e => typeof e === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(e)) : [];
      }
      return g;
    });
  }

  // ---------- Home rendering ----------
  function renderStats() {
    if (goals.length === 0) { statsLine.textContent = 'No goals yet'; return; }
    const month = todayStr().slice(0, 7);
    let savedThisMonth = 0;
    let best = 0;
    goals.forEach(g => {
      if (g.type === 'savings') {
        g.entries.forEach(e => { if (e.date.startsWith(month)) savedThisMonth += e.amount; });
      } else {
        best = Math.max(best, currentStreak(g.entries));
      }
    });
    const parts = [goals.length + ' goal' + (goals.length === 1 ? '' : 's')];
    if (savedThisMonth > 0) parts.push(formatMoney(savedThisMonth) + ' saved this month');
    if (best > 0) parts.push(best + '-day best streak');
    statsLine.textContent = parts.join(' · ');
  }

  function renderHome() {
    renderStats();
    homeEl.innerHTML = '';
    if (goals.length === 0) {
      homeEl.innerHTML = `
        <div class="empty-state">
          <div class="glyph">🎯</div>
          <h2>Start seeking</h2>
          <p>Add a savings goal or a daily streak to start tracking progress.</p>
        </div>`;
      return;
    }
    goals.forEach(g => homeEl.appendChild(buildGoalCard(g)));
  }

  function buildGoalCard(g) {
    const card = document.createElement('div');
    card.className = 'goal-card';
    card.addEventListener('click', () => openDetail(g.id));

    if (g.type === 'savings') {
      const pct = g.target > 0 ? Math.min(1, g.current / g.target) : 0;
      const offset = RING_C * (1 - pct);
      card.innerHTML = `
        <div class="ring-wrap">
          <svg viewBox="0 0 60 60">
            <circle class="ring-bg" cx="30" cy="30" r="${RING_R}" stroke-width="6"></circle>
            <circle class="ring-fill" cx="30" cy="30" r="${RING_R}" stroke-width="6"
              stroke="#3ECF8E" stroke-dasharray="${RING_C}" stroke-dashoffset="${offset}"></circle>
          </svg>
          <div class="ring-emoji">${g.emoji}</div>
        </div>
        <div class="goal-info">
          <div class="name">${escapeHtml(g.name)}</div>
          <div class="sub"><span class="accent-green num">${formatMoney(g.current)}</span> of ${formatMoney(g.target)}</div>
        </div>`;
    } else {
      const streak = currentStreak(g.entries);
      const dots = Array.from({ length: 7 }, (_, i) => {
        const day = daysAgoStr(6 - i);
        return `<div class="d ${g.entries.includes(day) ? 'on' : ''}"></div>`;
      }).join('');
      card.innerHTML = `
        <div class="streak-badge">
          <div class="n num">${streak}</div>
          <div class="u">days</div>
        </div>
        <div class="goal-info">
          <div class="name">${escapeHtml(g.name)}</div>
          <div class="sub"><span class="accent-amber">${g.emoji}</span> daily streak</div>
          <div class="dot-row">${dots}</div>
        </div>`;
    }
    return card;
  }

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // ---------- Detail screen ----------
  function openDetail(id) {
    activeGoalId = id;
    renderDetail();
    detailScreen.classList.add('show');
  }
  function closeDetail() {
    detailScreen.classList.remove('show');
    activeGoalId = null;
  }
  backBtn.addEventListener('click', closeDetail);

  function getActiveGoal() {
    return goals.find(g => g.id === activeGoalId);
  }

  function renderDetail() {
    const g = getActiveGoal();
    if (!g) return;

    if (g.type === 'savings') {
      const pct = g.target > 0 ? Math.min(1, g.current / g.target) : 0;
      const offset = BIG_RING_C * (1 - pct);
      const reached = g.current >= g.target && g.target > 0;
      detailBody.innerHTML = `
        <div class="detail-hero">
          <div class="emoji">${g.emoji}</div>
          <div class="name">${escapeHtml(g.name)}</div>
          <div class="big-ring">
            <svg viewBox="0 0 168 168">
              <circle class="ring-bg" cx="84" cy="84" r="${BIG_RING_R}" stroke-width="12"></circle>
              <circle class="ring-fill" cx="84" cy="84" r="${BIG_RING_R}" stroke-width="12"
                stroke="#3ECF8E" stroke-dasharray="${BIG_RING_C}" stroke-dashoffset="${offset}"></circle>
            </svg>
            <div class="big-ring-center">
              <div class="pct num">${Math.round(pct * 100)}%</div>
              <div class="amt num">${formatMoney(g.current)} / ${formatMoney(g.target)}</div>
            </div>
          </div>
          <button class="action-btn green" id="logBtn">${reached ? '🎉 Add more' : '+ Log contribution'}</button>
        </div>
        <div class="section-label">History</div>
        <div id="entryList">${renderEntryList(g)}</div>
        ${renderReminderRow(g)}
      `;
      document.getElementById('logBtn').addEventListener('click', openLogSheet);
    } else {
      const streak = currentStreak(g.entries);
      const best = bestStreak(g.entries);
      const doneToday = g.entries.includes(todayStr());
      const cells = Array.from({ length: 28 }, (_, i) => {
        const day = daysAgoStr(27 - i);
        return `<div class="cell ${g.entries.includes(day) ? 'on' : ''}"></div>`;
      }).join('');
      detailBody.innerHTML = `
        <div class="detail-hero">
          <div class="emoji">${g.emoji}</div>
          <div class="name">${escapeHtml(g.name)}</div>
          <div class="streak-hero">
            <div class="flame">🔥</div>
            <div class="count num">${streak}</div>
            <div class="label">day streak</div>
            <div class="best num">Best: ${best} days</div>
          </div>
          <div class="checkin-grid">${cells}</div>
          <button class="action-btn ${doneToday ? 'done' : 'amber'}" id="checkinBtn">${doneToday ? '✓ Done for today' : "Mark today done"}</button>
        </div>
        ${renderReminderRow(g)}
      `;
      document.getElementById('checkinBtn').addEventListener('click', () => {
        toggleToday(g);
      });
    }

    wireReminderRow(g);
  }

  function renderEntryList(g) {
    if (g.entries.length === 0) {
      return `<div style="color:var(--ink-dim); font-size:13px;">No contributions logged yet.</div>`;
    }
    return [...g.entries].reverse().map(e => `
      <div class="entry-row">
        <div>
          <div>${e.note ? escapeHtml(e.note) : 'Contribution'}</div>
          <div class="date">${formatDate(e.date)}</div>
        </div>
        <div class="amt num">+${formatMoney(e.amount)}</div>
      </div>
    `).join('');
  }

  function formatDate(d) {
    const date = parseLocalDate(d);
    return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }

  function renderReminderRow(g) {
    return `
      <div class="reminder-row">
        <div>
          <div class="label-text">Daily reminder</div>
          <div class="sub-text" id="reminderSub">${g.reminderEnabled ? 'Reminding at ' + (g.reminderTime || '09:00') : 'Off'}</div>
          ${g.reminderEnabled ? `<input type="time" class="time-input" id="reminderTime" value="${g.reminderTime || '09:00'}" />` : ''}
        </div>
        <label class="switch">
          <input type="checkbox" id="reminderToggle" ${g.reminderEnabled ? 'checked' : ''} />
          <span class="switch-track"></span>
        </label>
      </div>`;
  }

  function wireReminderRow(g) {
    const toggle = document.getElementById('reminderToggle');
    if (!toggle) return;
    toggle.addEventListener('change', async () => {
      toggle.disabled = true;
      g.reminderEnabled = toggle.checked;
      if (!g.reminderTime) g.reminderTime = '09:00';
      saveGoals();
      await scheduleReminder(g);
      renderDetail();
      haptic('Light');
    });
    const timeInput = document.getElementById('reminderTime');
    if (timeInput) {
      timeInput.addEventListener('change', async () => {
        g.reminderTime = timeInput.value;
        saveGoals();
        await scheduleReminder(g);
        const sub = document.getElementById('reminderSub');
        if (sub) sub.textContent = 'Reminding at ' + g.reminderTime;
      });
    }
  }

  // ---------- Notifications ----------
  // All of this degrades silently (no-op) if @capacitor/local-notifications
  // isn't installed — e.g. during web preview.
  async function ensureChannel() {
    try {
      const LN = window.Capacitor?.Plugins?.LocalNotifications;
      if (!LN) return;
      await LN.createChannel({
        id: NOTIF_CHANNEL_ID,
        name: 'Goal Reminders',
        description: 'Daily reminders for your goals',
        importance: 4,
        visibility: 1
      });
    } catch (e) { /* channel likely already exists */ }
  }

  async function ensureNotificationPermission() {
    try {
      const LN = window.Capacitor?.Plugins?.LocalNotifications;
      if (!LN) return false;
      let status = await LN.checkPermissions();
      if (status.display !== 'granted') {
        status = await LN.requestPermissions();
      }
      return status.display === 'granted';
    } catch (e) { return false; }
  }

  function hashId(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
    return h % 1000000;
  }

  async function cancelReminder(g) {
    try {
      const LN = window.Capacitor?.Plugins?.LocalNotifications;
      if (!LN) return;
      await LN.cancel({ notifications: [{ id: hashId(g.id) }] });
    } catch (e) {}
  }

  async function scheduleReminder(g) {
    try {
      const LN = window.Capacitor?.Plugins?.LocalNotifications;
      if (!LN) return;
      const notifId = hashId(g.id);
      await LN.cancel({ notifications: [{ id: notifId }] });
      if (!g.reminderEnabled) return;
      await ensureChannel();
      const granted = await ensureNotificationPermission();
      if (!granted) {
        // Permission denied — don't leave the UI claiming a reminder is on.
        g.reminderEnabled = false;
        saveGoals();
        if (activeGoalId === g.id) renderDetail();
        return;
      }
      const [h, m] = (g.reminderTime || '09:00').split(':').map(Number);
      await LN.schedule({
        notifications: [{
          id: notifId,
          title: 'Seeking',
          body: g.type === 'savings' ? `Add a contribution to "${g.name}"` : `Keep your "${g.name}" streak alive`,
          channelId: NOTIF_CHANNEL_ID,
          schedule: { on: { hour: h, minute: m }, repeats: true }
        }]
      });
    } catch (e) { /* no-op */ }
  }

  async function rescheduleAllReminders() {
    try {
      const LN = window.Capacitor?.Plugins?.LocalNotifications;
      if (!LN) return;
      await ensureChannel();
      for (const g of goals) {
        if (g.reminderEnabled) await scheduleReminder(g);
      }
    } catch (e) {}
  }

  function toggleToday(g) {
    const today = todayStr();
    const idx = g.entries.indexOf(today);
    if (idx === -1) { g.entries.push(today); haptic('Medium'); }
    else { g.entries.splice(idx, 1); haptic('Light'); }
    saveGoals();
    renderDetail();
    renderHome();
  }

  deleteGoalBtn.addEventListener('click', async () => {
    const g = getActiveGoal();
    if (!g) return;
    if (!confirm(`Delete "${g.name}"? This can't be undone.`)) return;
    await cancelReminder(g);
    goals = goals.filter(x => x.id !== g.id);
    saveGoals();
    closeDetail();
    renderHome();
    haptic('Light');
  });

  // ---------- Add / Edit goal sheet ----------
  emojiRow.innerHTML = EMOJIS.map((e, i) =>
    `<button type="button" data-e="${e}" class="${i === 0 ? 'active' : ''}">${e}</button>`
  ).join('');
  emojiRow.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      newGoalEmoji = btn.dataset.e;
      emojiRow.querySelectorAll('button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });
  });

  typeSavingsBtn.addEventListener('click', () => setNewGoalType('savings'));
  typeStreakBtn.addEventListener('click', () => setNewGoalType('streak'));
  function setNewGoalType(t) {
    newGoalType = t;
    typeSavingsBtn.classList.toggle('active', t === 'savings');
    typeStreakBtn.classList.toggle('active', t === 'streak');
    targetField.style.display = t === 'savings' ? 'block' : 'none';
  }

  function openAddSheet() {
    editingGoalId = null;
    goalSheetTitle.textContent = 'New goal';
    saveGoalBtn.textContent = 'Create goal';
    typeSection.style.display = 'block';
    goalNameInput.value = '';
    goalTargetInput.value = '';
    clearFieldError(goalNameInput, goalNameError);
    clearFieldError(goalTargetInput, goalTargetError);
    setNewGoalType('savings');
    newGoalEmoji = EMOJIS[0];
    emojiRow.querySelectorAll('button').forEach((b, i) => b.classList.toggle('active', i === 0));
    addOverlay.classList.add('show');
  }

  function openEditSheet(g) {
    editingGoalId = g.id;
    newGoalType = g.type;
    goalSheetTitle.textContent = 'Edit goal';
    saveGoalBtn.textContent = 'Save changes';
    typeSection.style.display = 'none'; // type can't change after creation
    goalNameInput.value = g.name;
    clearFieldError(goalNameInput, goalNameError);
    if (g.type === 'savings') {
      targetField.style.display = 'block';
      goalTargetInput.value = g.target;
      clearFieldError(goalTargetInput, goalTargetError);
    } else {
      targetField.style.display = 'none';
    }
    newGoalEmoji = g.emoji;
    emojiRow.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.e === g.emoji));
    addOverlay.classList.add('show');
  }

  fabAdd.addEventListener('click', openAddSheet);
  editGoalBtn.addEventListener('click', () => {
    const g = getActiveGoal();
    if (g) openEditSheet(g);
  });

  cancelAddBtn.addEventListener('click', () => addOverlay.classList.remove('show'));
  addOverlay.addEventListener('click', (e) => { if (e.target === addOverlay) addOverlay.classList.remove('show'); });

  saveGoalBtn.addEventListener('click', () => {
    const name = goalNameInput.value;
    const nameValid = validateGoalName(name);
    setFieldError(goalNameInput, goalNameError, !nameValid);
    if (!nameValid) { goalNameInput.focus(); return; }

    let targetVal = 0;
    if (newGoalType === 'savings') {
      const targetValid = validatePositiveAmount(goalTargetInput.value);
      setFieldError(goalTargetInput, goalTargetError, !targetValid);
      if (!targetValid) { goalTargetInput.focus(); return; }
      targetVal = parseFloat(goalTargetInput.value);
    }

    if (editingGoalId) {
      const g = goals.find(x => x.id === editingGoalId);
      if (g) {
        g.name = name.trim();
        g.emoji = newGoalEmoji;
        if (g.type === 'savings') g.target = targetVal;
      }
      saveGoals();
      addOverlay.classList.remove('show');
      renderHome();
      if (activeGoalId === editingGoalId) renderDetail();
      haptic('Medium');
    } else {
      const goal = {
        id: uid(),
        type: newGoalType,
        name: name.trim(),
        emoji: newGoalEmoji,
        reminderEnabled: false,
        reminderTime: '09:00',
        entries: []
      };
      if (newGoalType === 'savings') {
        goal.target = targetVal;
        goal.current = 0;
      }
      goals.push(goal);
      saveGoals();
      addOverlay.classList.remove('show');
      renderHome();
      haptic('Medium');
    }
  });

  // ---------- Log contribution sheet ----------
  function openLogSheet() {
    logAmountInput.value = '';
    logNoteInput.value = '';
    clearFieldError(logAmountInput, logAmountError);
    logOverlay.classList.add('show');
  }
  cancelLogBtn.addEventListener('click', () => logOverlay.classList.remove('show'));
  logOverlay.addEventListener('click', (e) => { if (e.target === logOverlay) logOverlay.classList.remove('show'); });

  saveLogBtn.addEventListener('click', () => {
    const valid = validatePositiveAmount(logAmountInput.value);
    setFieldError(logAmountInput, logAmountError, !valid);
    if (!valid) { logAmountInput.focus(); return; }
    const amount = parseFloat(logAmountInput.value);
    const g = getActiveGoal();
    if (!g) return;
    g.entries.push({ date: todayStr(), amount: amount, note: logNoteInput.value.trim().slice(0, 80) });
    g.current = g.entries.reduce((sum, e) => sum + e.amount, 0);
    saveGoals();
    logOverlay.classList.remove('show');
    renderDetail();
    renderHome();
    haptic('Medium');
  });

  // ---------- Settings sheet (currency + backup/restore) ----------
  openSettingsBtn.addEventListener('click', () => {
    refreshCurrencyGrid();
    settingsOverlay.classList.add('show');
  });
  closeSettingsBtn.addEventListener('click', () => settingsOverlay.classList.remove('show'));
  settingsOverlay.addEventListener('click', (e) => { if (e.target === settingsOverlay) settingsOverlay.classList.remove('show'); });

  exportBtn.addEventListener('click', async () => {
    try {
      const payload = {
        app: 'seeking',
        version: 1,
        exportedAt: new Date().toISOString(),
        currency: getCurrency(),
        goals: goals
      };
      const json = JSON.stringify(payload, null, 2);
      const fileName = 'seeking-backup-' + todayStr() + '.json';
      const FS = window.Capacitor?.Plugins?.Filesystem;
      const Share = window.Capacitor?.Plugins?.Share;
      if (FS) {
        const result = await FS.writeFile({ path: fileName, data: json, directory: 'CACHE', encoding: 'utf8' });
        if (Share) {
          await Share.share({ title: 'Seeking backup', url: result.uri });
        } else {
          alert('Backup saved to app cache as ' + fileName);
        }
      } else {
        // Web preview fallback: plain browser download
        const blob = new Blob([json], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      }
      haptic('Medium');
    } catch (err) {
      alert('Export failed: ' + err.message);
    }
  });

  importBtn.addEventListener('click', () => importInput.click());
  importInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      const parsed = JSON.parse(text);
      if (!parsed || !Array.isArray(parsed.goals)) throw new Error("This file doesn't look like a Seeking backup.");
      const cleaned = sanitizeGoals(parsed.goals);
      if (!confirm(`Restore ${cleaned.length} goal(s)? This replaces your current goals.`)) { importInput.value = ''; return; }
      for (const g of goals) await cancelReminder(g);
      goals = cleaned;
      if (parsed.currency && CURRENCIES[parsed.currency]) setCurrency(parsed.currency);
      saveGoals();
      renderHome();
      refreshCurrencyGrid();
      await rescheduleAllReminders();
      haptic('Medium');
    } catch (err) {
      alert('Could not import backup: ' + err.message);
    }
    importInput.value = '';
  });

  // ---------- Android hardware back button ----------
  // Closes the topmost sheet/detail screen instead of exiting the app immediately.
  function closeTopOverlay() {
    const overlays = [addOverlay, logOverlay, settingsOverlay];
    for (const ov of overlays) {
      if (ov.classList.contains('show')) {
        ov.classList.remove('show');
        return true;
      }
    }
    return false;
  }
  function initBackButton() {
    try {
      const AppPlugin = window.Capacitor?.Plugins?.App;
      if (!AppPlugin) return;
      AppPlugin.addListener('backButton', () => {
        if (closeTopOverlay()) return;
        if (detailScreen.classList.contains('show')) { closeDetail(); return; }
        AppPlugin.minimizeApp();
      });
    } catch (e) { /* no-op */ }
  }

  // ---------- Native UI polish: status bar + keyboard ----------
  async function initNativeUI() {
    try {
      const SB = window.Capacitor?.Plugins?.StatusBar;
      if (SB) {
        await SB.setOverlaysWebView({ overlay: true });
        await SB.setStyle({ style: 'DARK' }); // light status bar icons for our dark background
      }
    } catch (e) { /* no-op */ }

    try {
      const KB = window.Capacitor?.Plugins?.Keyboard;
      if (KB) {
        KB.addListener('keyboardWillShow', (info) => {
          const height = (info && info.keyboardHeight) || 280;
          document.querySelectorAll('.overlay.show .sheet').forEach(s => {
            s.style.paddingBottom = (height + 16) + 'px';
          });
        });
        KB.addListener('keyboardWillHide', () => {
          document.querySelectorAll('.sheet').forEach(s => { s.style.paddingBottom = ''; });
        });
      }
    } catch (e) { /* no-op */ }
  }

  // ---------- Boot ----------
  goals = sanitizeGoals(goals);
  saveGoals();
  renderHome();
  initBackButton();
  initNativeUI();
  rescheduleAllReminders();
  if (window.Capacitor) console.log('Seeking running natively on Android');
})();
</script>

</body>
</html>

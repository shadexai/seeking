<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>seeking</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #121212; color: #e0e0e0;
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; padding: 20px;
    }
    #app {
      max-width: 480px; width: 100%;
      background: #1e1e1e; border-radius: 28px;
      padding: 30px 20px; text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    h1 { font-weight: 500; font-size: 2rem; margin-bottom: 24px; }
    button {
      background: #3b82f6; border: none; color: white;
      font-size: 1.1rem; padding: 14px; border-radius: 40px;
      width: 100%; margin: 10px 0; cursor: pointer;
      font-weight: 500; transition: background 0.2s;
    }
    button:active { background: #2563eb; }
    button:disabled { opacity: 0.6; pointer-events: none; }
    #fileName { margin: 10px 0 6px; color: #a0a0a0; word-break: break-all; font-size: 0.95rem; }
    #serverInfo { margin-top: 20px; }
    #serverInfo a { color: #60a5fa; text-decoration: none; font-size: 1.2rem; word-break: break-all; }
    #qrcode { margin: 16px auto; display: inline-block; background: white; padding: 10px; border-radius: 12px; }
    #status { margin-top: 16px; padding: 12px; border-radius: 12px; background: #2a2a2a; font-size: 0.95rem; color: #bbb; }
  </style>
</head>
<body>
<div id="app">
  <h1>📺 seeking</h1>
  <button id="pickBtn">📁 Select MP4 Video</button>
  <p id="fileName">No file selected</p>
  <div id="step2" style="display:none;">
    <button id="startBtn">🚀 Start Server</button>
  </div>
  <div id="serverInfo" style="display:none;">
    <h3>Server running at:</h3>
    <p><a id="urlLink" href="#" target="_blank"></a></p>
    <div id="qrcode"></div>
    <button id="stopBtn">⏹ Stop Server</button>
  </div>
  <div id="status"></div>
</div>

<!-- QRCode library from CDN (no extra file) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
  // ---- Capacitor plugin wrapper (inline) ----
  const { registerPlugin } = window.Capacitor || { registerPlugin: () => {} };
  const LocalStreamPlugin = registerPlugin('LocalStream', {
    pickFile: () => new Promise((resolve, reject) => {
      window.LocalStream?.pickFile(resolve, reject);
    }),
    startServer: (opts) => new Promise((resolve, reject) => {
      window.LocalStream?.startServer(opts, resolve, reject);
    }),
    stopServer: () => new Promise((resolve, reject) => {
      window.LocalStream?.stopServer(resolve, reject);
    })
  });

  // ---- App logic ----
  const pickBtn = document.getElementById('pickBtn');
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  const fileName = document.getElementById('fileName');
  const step2 = document.getElementById('step2');
  const serverInfo = document.getElementById('serverInfo');
  const urlLink = document.getElementById('urlLink');
  const qrContainer = document.getElementById('qrcode');
  const statusDiv = document.getElementById('status');

  let selectedUri = null;
  let serverRunning = false;

  function setStatus(msg, isError = false) {
    statusDiv.textContent = msg;
    statusDiv.style.color = isError ? '#f87171' : '#bbb';
  }

  pickBtn.addEventListener('click', async () => {
    try {
      setStatus('Opening file picker...');
      const result = await LocalStreamPlugin.pickFile();
      if (result && result.uri) {
        selectedUri = result.uri;
        fileName.textContent = result.name || 'Selected video';
        step2.style.display = 'block';
        serverInfo.style.display = 'none';
        setStatus('File ready. Tap "Start Server".');
      } else {
        setStatus('No file selected.', true);
      }
    } catch (err) {
      console.error(err);
      setStatus('Error picking file: ' + err.message, true);
    }
  });

  startBtn.addEventListener('click', async () => {
    if (!selectedUri) { setStatus('Select a video first.', true); return; }
    if (serverRunning) { setStatus('Already running.', true); return; }
    try {
      setStatus('Starting server...');
      const result = await LocalStreamPlugin.startServer({ fileUri: selectedUri, port: 8080 });
      serverRunning = true;
      const url = `http://${result.ip}:${result.port}`;
      urlLink.href = url;
      urlLink.textContent = url;
      qrContainer.innerHTML = '';
      new QRCode(qrContainer, { text: url, width: 200, height: 200, colorDark: '#000', colorLight: '#fff', correctLevel: QRCode.CorrectLevel.H });
      serverInfo.style.display = 'block';
      step2.style.display = 'none';
      setStatus(`✅ Server running at ${url}`);
    } catch (err) {
      console.error(err);
      setStatus('Error starting server: ' + err.message, true);
    }
  });

  stopBtn.addEventListener('click', async () => {
    if (!serverRunning) return;
    try {
      setStatus('Stopping server...');
      await LocalStreamPlugin.stopServer();
      serverRunning = false;
      serverInfo.style.display = 'none';
      step2.style.display = 'block';
      setStatus('Server stopped.');
    } catch (err) {
      console.error(err);
      setStatus('Error stopping server: ' + err.message, true);
    }
  });
</script>
</body>
</html>

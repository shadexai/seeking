<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>My Awesome App</title>
  
  <!-- Link your Web App Manifest (already created) -->
  <link rel="manifest" href="manifest.json" />
  
  <style>
    /* --- Modern CSS Reset & Variables --- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    :root {
      --primary: #6366f1;        /* Indigo */
      --primary-dark: #4f46e5;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-light: #64748b;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 20px;
    }

    /* --- App Top Bar --- */
    .app-bar {
      background: var(--primary);
      color: white;
      padding: 18px 24px;
      font-size: 20px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 10px rgb(99 102 241 / 0.3);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .app-bar span {
      font-size: 24px;
    }

    /* --- Main Content --- */
    .container {
      padding: 24px;
      max-width: 480px;
      margin: 0 auto;
      width: 100%;
      flex: 1;
    }

    /* --- Cards --- */
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
      transition: transform 0.2s ease;
    }
    .card h2 {
      font-size: 22px;
      margin-bottom: 8px;
      color: var(--text-main);
    }
    .card p {
      color: var(--text-light);
      line-height: 1.5;
      margin-bottom: 16px;
    }

    /* --- Buttons --- */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 500;
      border: none;
      border-radius: 30px;
      background: var(--primary);
      color: white;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgb(99 102 241 / 0.2);
    }
    .btn:active {
      transform: scale(0.96);
      background: var(--primary-dark);
    }
    .btn-outline {
      background: transparent;
      color: var(--primary);
      border: 2px solid var(--primary);
      box-shadow: none;
    }
    .btn-outline:active {
      background: var(--primary);
      color: white;
    }

    /* --- Counter Display --- */
    .counter-display {
      font-size: 48px;
      font-weight: 700;
      color: var(--primary);
      text-align: center;
      margin: 16px 0;
    }

    /* --- Footer Navigation (Simulated) --- */
    .bottom-nav {
      background: white;
      border-top: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-around;
      padding: 12px 0;
      position: sticky;
      bottom: 0;
      width: 100%;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 12px;
      color: var(--text-light);
      cursor: pointer;
      transition: color 0.2s;
    }
    .nav-item.active {
      color: var(--primary);
    }
    .nav-item span {
      font-size: 24px;
      margin-bottom: 2px;
    }

    /* --- Toast / Alert (built-in) --- */
    #toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #1e293b;
      color: white;
      padding: 12px 20px;
      border-radius: 40px;
      font-size: 14px;
      opacity: 0;
      transition: all 0.3s ease;
      pointer-events: none;
      box-shadow: 0 8px 16px rgb(0 0 0 / 0.2);
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <header class="app-bar">
    <span>🚀</span> MyApp
  </header>

  <!-- Main Content -->
  <main class="container">
    
    <!-- Welcome Card -->
    <div class="card">
      <h2>Welcome to Your App!</h2>
      <p>This is a fully native Android app built with Capacitor. You can edit this text anytime in your GitHub repository.</p>
      <button class="btn" id="actionBtn">Tap to Interact</button>
    </div>

    <!-- Interactive Card (Counter) -->
    <div class="card" style="text-align: center;">
      <h2>Interactive Counter</h2>
      <p>Click the buttons below to change the number.</p>
      
      <div class="counter-display" id="counterDisplay">0</div>
      
      <div style="display: flex; gap: 12px; justify-content: center;">
        <button class="btn" id="decreaseBtn">-</button>
        <button class="btn btn-outline" id="resetBtn">↺ Reset</button>
        <button class="btn" id="increaseBtn">+</button>
      </div>
    </div>

  </main>

  <!-- Bottom Navigation (Visual only) -->
  <nav class="bottom-nav">
    <div class="nav-item active"><span>🏠</span> Home</div>
    <div class="nav-item"><span>⚙️</span> Settings</div>
    <div class="nav-item"><span>👤</span> Profile</div>
  </nav>

  <!-- Toast Notification -->
  <div id="toast">Hello from Capacitor!</div>

  <script>
    // --- App Logic ---

    // 1. Counter State
    let count = 0;
    const display = document.getElementById('counterDisplay');
    const incBtn = document.getElementById('increaseBtn');
    const decBtn = document.getElementById('decreaseBtn');
    const resetBtn = document.getElementById('resetBtn');
    const actionBtn = document.getElementById('actionBtn');
    const toast = document.getElementById('toast');

    function updateDisplay() {
      display.textContent = count;
    }

    // 2. Event Listeners
    incBtn.addEventListener('click', () => { count++; updateDisplay(); });
    decBtn.addEventListener('click', () => { if (count > 0) count--; updateDisplay(); });
    resetBtn.addEventListener('click', () => { count = 0; updateDisplay(); });

    // 3. Toast Notification Helper
    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    // 4. Main Action Button
    actionBtn.addEventListener('click', () => {
      showToast('🎉 You tapped the main button!');
    });

    // 5. (Optional) Check if we are running on a real device via Capacitor
    // This allows you to use native plugins later!
    if (window.Capacitor) {
      console.log("Running natively on Android!");
      // Example: If you install the camera plugin, you can call it here:
      // const { Camera } = await import('@capacitor/camera');
    }

    console.log("App is ready!");
  </script>

</body>
</html>
